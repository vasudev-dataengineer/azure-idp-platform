name: Product Service CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/product-service/**"
      - ".github/workflows/product-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: applications/product-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate FastAPI application
        working-directory: applications/product-service
        run: |
          python -c "from main import app; assert app is not None"

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push Docker image to ACR
        working-directory: applications/product-service
        run: |
          az acr build \
            --registry acraidpdev5c251u \
            --image product-service:${{ github.sha }} \
            --file Dockerfile \
            .